      <path d="M8 16h34v18H8z" fill="none" stroke="#F4F9FF" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M9 17l16 11 16-11" fill="none" stroke="#F4F9FF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 198)">
