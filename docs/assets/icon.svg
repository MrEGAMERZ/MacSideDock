<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mac Side Dock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6578"/>
      <stop offset="42%" stop-color="#2C3340"/>
      <stop offset="100%" stop-color="#151820"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F6FA" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#C8D0DC" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="finder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63C4F7"/>
      <stop offset="100%" stop-color="#1A7ED4"/>
    </linearGradient>
    <linearGradient id="safari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3EC4FF"/>
      <stop offset="100%" stop-color="#0066D6"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EC8FF"/>
      <stop offset="100%" stop-color="#1478F0"/>
    </linearGradient>
    <linearGradient id="notes" x1="0" y1="0" x2="0" y2="1">
