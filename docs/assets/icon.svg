  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#shine)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="58" y="86" width="92" height="340" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.5"/>
  </g>

  <g transform="translate(79 118)">
    <rect width="50" height="50" rx="13" fill="url(#finder)"/>
    <circle cx="-11" cy="25" r="3" fill="#F5F7FA"/>
