<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="SIDEDOCK on the left edge of a Mac desktop">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9D6E3"/>
      <stop offset="38%" stop-color="#8BA4B8"/>
      <stop offset="72%" stop-color="#5B7388"/>
      <stop offset="100%" stop-color="#2F4252"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#F4E4C8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4E4C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="menubar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F5F5F7" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="dockglass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#E8EEF5" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFBFD"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
    <linearGradient id="finder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63C4F7"/>
      <stop offset="100%" stop-color="#1A7ED4"/>
    </linearGradient>
    <linearGradient id="safari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3EC4FF"/>
      <stop offset="100%" stop-color="#0066D6"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EC8FF"/>
      <stop offset="100%" stop-color="#1478F0"/>
    </linearGradient>
    <linearGradient id="notes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE36A"/>
      <stop offset="100%" stop-color="#F5B400"/>
    </linearGradient>
    <linearGradient id="settings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D5D8DE"/>
      <stop offset="100%" stop-color="#8E939C"/>
    </linearGradient>
    <linearGradient id="music" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B8A"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <filter id="dockshadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="10" dy="12" stdDeviation="18" flood-color="#1D1D1F" flood-opacity="0.28"/>
    </filter>
    <filter id="windowshadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1D1D1F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#wallpaper)"/>
  <rect width="1440" height="900" fill="url(#sun)"/>
  <ellipse cx="1100" cy="720" rx="520" ry="180" fill="#2A3C4C" opacity="0.18"/>
  <ellipse cx="420" cy="780" rx="380" ry="140" fill="#1D2A34" opacity="0.12"/>

  <rect width="1440" height="36" fill="url(#menubar)"/>
  <g fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <circle cx="28" cy="18" r="5" fill="#F5F5F7" fill-opacity="0.92"/>
    <text x="44" y="22" font-size="13" font-weight="600">Finder</text>
    <text x="98" y="22" font-size="13" fill-opacity="0.72">File</text>
    <text x="132" y="22" font-size="13" fill-opacity="0.72">Edit</text>
    <text x="170" y="22" font-size="13" fill-opacity="0.72">View</text>
    <text x="1248" y="22" font-size="12" fill-opacity="0.78">Tue 15 Sep</text>
    <text x="1338" y="22" font-size="12" fill-opacity="0.92">9:41</text>
  </g>

  <g filter="url(#windowshadow)" transform="translate(320 148)">
    <rect width="860" height="560" rx="12" fill="url(#window)"/>
    <rect width="860" height="44" rx="12" fill="#E8E8ED"/>
    <rect y="28" width="860" height="16" fill="#E8E8ED"/>
    <circle cx="22" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="22" r="6" fill="#28C840"/>
    <text x="430" y="27" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" fill="#6E6E73">Safari</text>
    <rect x="22" y="62" width="816" height="34" rx="8" fill="#FFFFFF"/>
    <text x="38" y="84" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" fill="#86868B">apple.com</text>
    <rect x="22" y="112" width="816" height="424" rx="8" fill="#F5F5F7"/>
    <rect x="64" y="156" width="280" height="22" rx="6" fill="#1D1D1F"/>
    <rect x="64" y="196" width="480" height="10" rx="5" fill="#D2D2D7"/>
    <rect x="64" y="218" width="400" height="10" rx="5" fill="#D2D2D7"/>
    <rect x="64" y="268" width="228" height="196" rx="18" fill="#FFFFFF"/>
    <rect x="312" y="268" width="228" height="196" rx="18" fill="#FFFFFF"/>
    <rect x="560" y="268" width="228" height="196" rx="18" fill="#FFFFFF"/>
  </g>

  <g filter="url(#dockshadow)" transform="translate(36 150)">
    <rect width="88" height="600" rx="28" fill="url(#dockglass)" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="1.2"/>

    <g transform="translate(20 32)">
      <circle cx="-10" cy="24" r="2.4" fill="#F5F5F7"/>
      <rect width="48" height="48" rx="12" fill="url(#finder)"/>
    </g>

    <g transform="translate(10 108)">
      <circle cx="0" cy="34" r="2.4" fill="#F5F5F7"/>
      <rect x="6" y="6" width="64" height="64" rx="16" fill="url(#safari)"/>
      <circle cx="38" cy="38" r="21" fill="none" stroke="#F7FBFF" stroke-width="3.4"/>
      <polygon points="38,16 44,38 38,60 32,38" fill="#E11F28"/>
      <polygon points="16,38 38,32 60,38 38,44" fill="#F4F7FB"/>
    </g>

    <g transform="translate(20 200)">
      <rect width="48" height="48" rx="12" fill="url(#mail)"/>
      <path d="M8 15h32v18H8z" fill="none" stroke="#F4F9FF" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M9 16l15 10 15-10" fill="none" stroke="#F4F9FF" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <g transform="translate(20 268)">
      <circle cx="-10" cy="24" r="2.4" fill="#F5F5F7"/>
      <rect width="48" height="48" rx="12" fill="url(#notes)"/>
      <rect x="11" y="14" width="26" height="3" rx="1.4" fill="#8A5A12" opacity="0.55"/>
      <rect x="11" y="22" width="20" height="3" rx="1.4" fill="#8A5A12" opacity="0.4"/>
      <rect x="11" y="30" width="23" height="3" rx="1.4" fill="#8A5A12" opacity="0.3"/>
    </g>

    <g transform="translate(20 336)">
      <rect width="48" height="48" rx="12" fill="url(#settings)"/>
      <circle cx="24" cy="24" r="8" fill="none" stroke="#F4F6F8" stroke-width="3"/>
      <circle cx="24" cy="24" r="3.2" fill="#F4F6F8"/>
    </g>

    <rect x="29" y="404" width="30" height="1" rx="0.5" fill="#FFFFFF" fill-opacity="0.38"/>

    <g transform="translate(20 428)" opacity="0.94">
      <rect width="48" height="48" rx="12" fill="url(#music)"/>
      <path d="M20 16v18a6 6 0 1 0 4 5V22h12v8a6 6 0 1 0 4 5V16z" fill="#FFF5F8"/>
    </g>

    <g transform="translate(20 496)" opacity="0.82">
      <rect width="48" height="48" rx="12" fill="#7C8899"/>
      <rect x="12" y="14" width="24" height="20" rx="4" fill="#E8EDF4"/>
    </g>
  </g>
</svg>
